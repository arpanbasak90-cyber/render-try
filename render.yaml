services:
  - type: web
    name: jalraksha-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_MODE
        value: postgres # Options: postgres, mongo, memory, sqlite
      - key: DATABASE_URL
        fromDatabase:
          name: jalraksha-db
          property: connectionString
      - key: MONGODB_URI
        value: "" # Fill if using MongoDB Atlas
      - key: FILTER_DURATION_S
        value: "300"
      - key: AUTH_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEVICE_TRANSPORT
        value: simulator

databases:
  - name: jalraksha-db
    databaseName: jalraksha
    user: jalraksha_user
    plan: free
