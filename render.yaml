services:
  - type: web
    name: jalraksha-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_MODE
        value: sqlite
      - key: SQLITE_DB_PATH
        value: jalraksha.db
      - key: FILTER_DURATION_S
        value: "300"
      - key: AUTH_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DEVICE_TRANSPORT
        value: simulator
